name: Import Hostinger backup

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-import
  cancel-in-progress: false

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      DRIVE_URL: https://drive.google.com/file/d/1OphbNn50U3elHh7t63nw5Ik68dw167pd/view?usp=sharing
      SITE_URL: https://purpleguide.study
    steps:
      - name: Check out main branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install import tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip git-lfs rsync
          python -m pip install --disable-pip-version-check gdown requests beautifulsoup4
          git lfs install --local

      - name: Download and verify Drive ZIP
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hostinger/extracted"
          python -m gdown "$DRIVE_URL" -O "$RUNNER_TEMP/hostinger/public_html.zip"
          test "$(stat -c%s "$RUNNER_TEMP/hostinger/public_html.zip")" -gt 2600000000
          unzip -tq "$RUNNER_TEMP/hostinger/public_html.zip"

      - name: Extract backup
        run: |
          set -euo pipefail
          unzip -q "$RUNNER_TEMP/hostinger/public_html.zip" -d "$RUNNER_TEMP/hostinger/extracted"

      - name: Bound live-site audit runtime
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/import-tools/import_hostinger.py')
          text = path.read_text()
          text = text.replace('max_pages: int = 250', 'max_pages: int = 30')
          text = text.replace('sorted(assets)[:1500]', 'sorted(assets)[:80]')
          text = text.replace('timeout=20', 'timeout=3')
          path.write_text(text)
          PY

      - name: Audit, clean, compare live site, and prepare repository
        run: |
          set -euo pipefail
          python .github/import-tools/import_hostinger.py \
            --archive "$RUNNER_TEMP/hostinger/public_html.zip" \
            --extract-dir "$RUNNER_TEMP/hostinger/extracted" \
            --repo "$GITHUB_WORKSPACE" \
            --site-url "$SITE_URL"

      - name: Sanitize framework credentials
        run: |
          set -euo pipefail
          python .github/import-tools/sanitize_sensitive.py --repo "$GITHUB_WORKSPACE"

      - name: Validate Git LFS coverage and repository safety
        run: |
          set -euo pipefail
          git lfs install --local
          git add .gitattributes .gitignore
          git add -A
          git lfs ls-files --name-only > "$RUNNER_TEMP/lfs-files.txt"

          bad=0
          while IFS= read -r -d '' file; do
            size=$(stat -c%s "$file")
            rel=${file#./}
            if [ "$size" -gt 100000000 ] && ! grep -Fxq "$rel" "$RUNNER_TEMP/lfs-files.txt"; then
              echo "ERROR: file over 100 MB is not tracked by LFS: $rel ($size bytes)"
              bad=1
            fi
            if [ "$size" -gt 2147483648 ]; then
              echo "ERROR: file over 2 GiB requires a higher Git LFS per-file plan or external object storage: $rel"
              bad=1
            fi
          done < <(find . -path './.git' -prune -o -type f -print0)
          test "$bad" -eq 0

          if git grep -Il -e 'BEGIN RSA PRIVATE KEY' -e 'BEGIN OPENSSH PRIVATE KEY' -e 'BEGIN PRIVATE KEY' -- ':!.github/**' | grep -q .; then
            echo 'ERROR: private key material remains in imported files.'
            exit 1
          fi

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hostinger-import-audit
          path: |
            HOSTINGER_IMPORT_AUDIT.md
            HOSTINGER_IMPORT_AUDIT.json
            HOSTINGER_SECURITY_SANITIZATION.md
            HOSTINGER_SECURITY_SANITIZATION.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit and push imported site
        run: |
          set -euo pipefail
          git config user.name 'purpleguide-import-bot'
          git config user.email 'project.mtfbwu+purpleguide-import@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No import changes to commit.'
            exit 0
          fi
          git commit -m 'Import and audit Hostinger website backup'
          git lfs push origin main --all
          git push origin HEAD:main
